<!DOCTYPE html>
<html lang= en >
<head>
  <meta charset= UTF-8 >
  <meta name= viewport  content= width=device-width, initial-scale=1.0 >
  <meta name="referrer" content="no-referrer-when-downgrade">
  <title>Cool Guy Music Mix</title>
  <link rel= stylesheet  href= style.css  />
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />


</head>

<body>
 <!-- REMOVE the onclick from this outer div -->
<div id="tv-tuner-overlay">
    <div class="static-bg"></div>
    <div class="tuner-content">
        <h1 class="glitch" data-text="ZTV 2.0">ZTV 2.0</h1>
        <p class="blink"> [ SIGNAL DETECTED ] </p>
        <!-- ADD the onclick directly to the button here -->
        <button class="tune-button" onclick="tuneIn()">TUNE IN</button>
    </div>
</div>

  
  
<div id= winamp-container >
  
  <div id="search-container">
  <div style="width:100%; max-width: 600px;">
    <input id="search-bar" type="text" placeholder="Search tracks, artists, or features...">
    <div id="search-results"></div>
  </div>
</div>
  <!--<div id= album-info >
    <img id= album-art  src= default_album.png  alt= Album Art >
    <div id= album-name >Loading Album...</div>
    <div id= album-year >Loading Year...</div>
   <div id="artist-summary-container" class="rpg-box">
  <div id="artist-summary" class="rpg-text"></div>
</div>
<button id="summary-toggle" onclick="showFullDescription()" style="display:none;">Read more</button>

    
     <div id= equalizer >
      <div class= bar ></div>

      <div class= bar ></div>

      <div class= bar ></div>
    </div> 
  </div>-->

<div id="music-player">
    <div id="now-playing-wrapper">
      <div id="now-playing" class="scrolling-text">Loading track...</div>
    </div>
    <div id="controls">
      <button onclick="prevSong()">Prev</button>
      <!-- <button onclick="shuffleSong()">Play/Shuffle</button> -->
      <button onclick="nextSong()">Next</button>
      <!-- <button onclick="toggleVideo()">Show/Hide Video</button> -->
    </div>
    <div id="search-container-mobile"> 
      <div style="width:100%; max-width: 600px; display: flex; align-items: center; flex-direction: column;">
       <input id="search-bar-mobile" type="text" placeholder="Search..." oninput="runSearchFilter(this.value, 'search-results-mobile')">
        <div id="search-results-mobile"></div>
      </div>
    </div>
    
    <div id="player">
      <video 
        id="ztv-stream-player" 
        class="video-js vjs-default-skin" 
        controls 
        autoplay 
        playsinline
        style="width: 100%; height: 100%;">
      </video>
    </div>
  </div>

  
  <div id="channel-selector-module">
    <div class="title-bar"><span>Available Channels</span></div>
    <div class="channel-grid">
        <button class="channel-btn active" onclick="switchChannel('live')">ZTV</button>
        <button class="channel-btn" onclick="switchChannel('deep-dives')">DEEP DIVE CENTRAL</button>
        <button class="channel-btn" onclick="switchChannel('deep-dives')">ZADULT SWIM</button>
        <button class="channel-btn" onclick="switchChannel('deep-dives')">Z4</button>
        <button class="channel-btn" onclick="switchChannel('deep-dives')">ZV LAND</button>
        <button class="channel-btn" onclick="switchChannel('deep-dives')">MOVIES AND TV</button>
        <button class="channel-btn" onclick="switchChannel('deep-dives')">COOKING CHANNEL</button>
        <button class="channel-btn" onclick="switchChannel('deep-dives')">PODCASTS</button>
        <button class="channel-btn" onclick="switchChannel('deep-dives')">TRAVEL</button>
        <button class="channel-btn" onclick="switchChannel('deep-dives')">AIR AMERICA</button>
        </div>
</div>
   
</div>
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script src="Youtube.min.js"></script>

<script src="script.js"></script>
</body>
</html>
